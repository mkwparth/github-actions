name: React PR CI

on:
  pull_request:
    branches:
      - main

jobs:
  react-custom-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Install dependencies
        run: npm install
        working-directory: src/src

      - name: Build React app
        run: npm run build
        working-directory: src/src
      
      - name: Make custom test executable
        run: chmod +x scripts/custom_react_test.sh
      
      - name: Run custom React test
        run: ./scripts/custom_react_test.sh
