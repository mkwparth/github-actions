name: React PR CI

on:
  pull_request:
    branches:
      - main

jobs:
  react-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: src
        run: npm install

      - name: Build React app
        working-directory: src
        run: npm run build

      - name: Run custom React test
        run: ./scripts/custom_react_test.sh
